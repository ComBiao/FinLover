name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  commit-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages
        run: |
          git log --no-merges --format=%s origin/${{ github.base_ref }}..HEAD | while IFS= read -r msg; do
            node scripts/check-commit-msg.js "$msg"
          done

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npx next typegen
      - run: npm run type-check
      
      - name: Verify ERD is up to date
        run: |
          npm run generate-erd
          if [[ -n "$(git status --porcelain docs/ERD.md)" ]]; then
            echo "❌ ERD is out of sync!"
            exit 1
          fi

      - run: npm run build
        env:
          MONGODB_URI: mongodb://localhost:27017/ci-placeholder
          JWT_SECRET: ci-placeholder-secret
          BCRYPT_SALT_ROUNDS: 10

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Run gitleaks
        run: gitleaks detect --source . --redact -v